<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Gerard 💖</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: none; /* Oculto al inicio hasta que pasen los 4 segundos */
        }

        /* Ventana estilo años 2000 */
        .retro-window {
            position: relative;
            z-index: 10;
            background: #c0c0c0;
            border: 2px outset #ffffff;
            width: 90%;
            max-width: 320px;
            box-shadow: 4px 4px 10px rgba(255, 255, 255, 0.2);
            color: #000000;
            text-align: center;
        }

        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            padding: 4px 8px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-bar-buttons span {
            background: #c0c0c0;
            color: black;
            border: 1px outset #ffffff;
            padding: 0 5px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .window-body {
            padding: 20px;
            font-size: 15px;
        }

        .btn-container {
            margin-top: 20px;
            display: flex;
            justify-content: space-around;
        }

        .retro-btn {
            background: #c0c0c0;
            border: 2px outset #ffffff;
            padding: 5px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
        }

        .retro-btn:active {
            border: 2px inset #ffffff;
        }

        #message-box {
            display: none;
        }
    </style>
    <!-- Three.js para el corazón 3D de partículas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Ventana 1: Verificación -->
    <div class="retro-window" id="window-1">
        <div class="title-bar">
            <span>Aviso_Sistema.exe</span>
            <div class="title-bar-buttons"><span>X</span></div>
        </div>
        <div class="window-body">
            <p><strong>ERES GERARD? :3</strong></p>
            <p style="font-size: 12px; color: #444;">esto es solo para él</p>
            <div class="btn-container">
                <button class="retro-btn" onclick="showSecondWindow()">SI</button>
                <button class="retro-btn" id="no-btn" onmouseover="moveNo()" ontouchstart="moveNo()">NO</button>
            </div>
        </div>
    </div>

    <!-- Ventana 2: Mensaje de amor -->
    <div class="retro-window" id="message-box">
        <div class="title-bar">
            <span>Mensaje_Importante.exe</span>
            <div class="title-bar-buttons"><span>X</span></div>
        </div>
        <div class="window-body">
            <p style="font-size: 18px; color: #b50606;"><strong>ti amuuuu... mucho mucho ❤️</strong></p>
            <p style="font-size: 11px; color: #555; margin-top: 10px;">Cargando sorpresa en 3D...</p>
        </div>
    </div>

    <script>
        // Mover el botón NO de forma divertida
        function moveNo() {
            const btnNo = document.getElementById('no-btn');
            const x = Math.random() * 100 - 50;
            const y = Math.random() * 100 - 50;
            btnNo.style.transform = `translate(${x}px, ${y}px)`;
        }

        function showSecondWindow() {
            document.getElementById('window-1').style.display = 'none';
            document.getElementById('message-box').style.display = 'block';

            // Después de 4 segundos, oculta la segunda ventana y lanza el corazón 3D de partículas
            setTimeout(() => {
                document.getElementById('message-box').style.display = 'none';
                document.getElementById('canvas-container').style.display = 'block';
                initHeart3D();
            }, 4000);
        }

        // --- CORAZÓN 3D DE PARTÍCULAS (Estilo Python/Art) ---
        function initHeart3D() {
            const container = document.getElementById('canvas-container');
            
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Generar partículas en forma de corazón matemático
            const particlesCount = 2500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particlesCount * 3);

            for (let i = 0; i < particlesCount; i++) {
                // Ecuación matemática del corazón en 3D
                const t = Math.random() * Math.PI * 2;
                const u = Math.random() * Math.PI;

                // Fórmulas matemáticas de volumen de corazón
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                let z = (Math.random() - 0.5) * 8; // Grosor/profundidad

                // Escalar tamaño
                const scale = 0.6;
                positions[i * 3] = x * scale;
                positions[i * 3 + 1] = y * scale;
                positions[i * 3 + 2] = z * scale;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            // Material rojo brillante para las partículas
            const material = new THREE.PointsMaterial({
                color: 0xff0033,
                size: 0.35,
                transparent: true,
                opacity: 0.85
            });

            const heartParticles = new THREE.Points(geometry, material);
            scene.add(heartParticles);

            camera.position.z = 25;

            // Variables para permitir mover/rotar con el mouse o dedo en el celular
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };

            window.addEventListener('mousedown', (e) => { isDragging = true; });
            window.addEventListener('mouseup', () => { isDragging = false; });
            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;
                    heartParticles.rotation.y += deltaX * 0.005;
                    heartParticles.rotation.x += deltaY * 0.005;
                }
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            // Soporte táctil para celulares
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    const touch = e.touches[0];
                    const deltaX = touch.clientX - previousMousePosition.x;
                    const deltaY = touch.clientY - previousMousePosition.y;
                    heartParticles.rotation.y += deltaX * 0.005;
                    heartParticles.rotation.x += deltaY * 0.005;
                    previousMousePosition = { x: touch.clientX, y: touch.clientY };
                }
            });

            // Animación continua de rotación automática
            function animate() {
                requestAnimationFrame(animate);
                if (!isDragging) {
                    heartParticles.rotation.y += 0.01;
                    heartParticles.rotation.x += 0.005;
                }
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
